name: npm-oidc-probe
on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask npm to exchange this run's identity for a publish token
        run: |
          idtoken=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          for pkg in codemuster @codemuster%2fdarwin-arm64 @codemuster%2flinux-x64; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $idtoken" -H 'Content-Type: application/json' \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$pkg")
            if [ "$code" = 200 ]; then echo "$pkg: trusted publishing is configured"; else
              echo "$pkg: HTTP $code"; head -c 400 /tmp/body; echo; fi
          done
