name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet restore
      - run: dotnet restore fixtures/mixed-repo/MixedRepo.sln
      - run: npm ci --prefix fixtures/mixed-repo/web
      - run: dotnet build --no-restore
      - run: dotnet test --no-build
