name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ['self-hosted', 'Linux', 'X64']
          - name: windows
            runner: 'windows-latest'
          - name: macos
            runner: 'macos-latest'
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: dotnet restore
      - run: dotnet restore fixtures/mixed-repo/MixedRepo.sln
      - run: dotnet restore fixtures/minimal-api/MinimalApi.sln
      - run: npm ci --prefix fixtures/mixed-repo/web
      - run: node --test npm/test/launcher.test.js
      - run: dotnet build --no-restore
      - run: dotnet test --no-build
